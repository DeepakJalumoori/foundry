[project]
name = "foundry-backend"
version = "0.1.0"
description = "Backend foundation for Foundry, a personal AI-powered startup job-search agent."
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.14.0,<2.0",
    "fastapi>=0.115.0,<1.0",
    "pydantic>=2.9.0,<3.0",
    "pydantic-settings>=2.6.0,<3.0",
    "python-multipart>=0.0.12,<1.0",
    "sqlalchemy>=2.0.35,<3.0",
    "uvicorn[standard]>=0.32.0,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0,<1.0",
    "pytest>=8.3.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
